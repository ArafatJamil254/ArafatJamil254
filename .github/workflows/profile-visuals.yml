name: Refresh Profile Visuals

# Images live on the same branch as README.md, so no output branch is needed.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'  # Daily at 08:17 in Bangladesh

permissions:
  contents: write

concurrency:
  group: profile-visuals
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out profile repository's default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: true

      - name: Generate contribution animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ArafatJamil254
          outputs: |
            assets/github-snake.svg?color_snake=#168fa5&color_dots=#e3f8fc,#a9dfeb,#76c5d9,#3b8cae,#16566e
            assets/github-snake-dark.svg?color_snake=#67e9f2&color_dots=#0b1f2d,#174058,#206984,#31a1b5,#86dfe9

      - name: Generate statistics from the public GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/build_stats.py --username ArafatJamil254 --output assets/github-stats.svg

      - name: Check all generated files
        run: |
          test -s assets/github-stats.svg
          test -s assets/github-snake.svg
          test -s assets/github-snake-dark.svg
          echo "All three graphics were generated."

      - name: Commit refreshed images to the default branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg assets/github-snake.svg assets/github-snake-dark.svg
          if git diff --cached --quiet; then
            echo "No visual changes to publish."
          else
            git commit -m "chore: refresh profile activity graphics [skip ci]"
            git push origin HEAD:${{ github.event.repository.default_branch }}
          fi
