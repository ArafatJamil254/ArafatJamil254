 <text x="36" y="192" font-family="DejaVu Sans, Arial, sans-serif" fill="#5fd7e9" font-size="16" font-weight="700" letter-spacing="1.8">SOFTWARE DEVELOPER  /  AI &amp; ML LEARNER</text>
