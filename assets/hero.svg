<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="336" viewBox="0 0 1200 336" role="img" aria-label="Md. Arafat Jamil — Software Developer and AI/ML Learner, futuristic navy and cyan portfolio banner">
<defs>
  <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#06111b"/><stop offset=".54" stop-color="#0a2433"/><stop offset="1" stop-color="#07131d"/></linearGradient>
  <radialGradient id="aura"><stop stop-color="#19cce0" stop-opacity=".23"/><stop offset=".6" stop-color="#0b829e" stop-opacity=".12"/><stop offset="1" stop-color="#12d2e3" stop-opacity="0"/></radialGradient>
  <linearGradient id="shine" x1="0" x2="1"><stop stop-color="#45f5ed"/><stop offset=".55" stop-color="#32b5ea"/><stop offset="1" stop-color="#8d8fff"/></linearGradient>
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M 30 0 L 0 0 0 30" stroke="#3b7189" stroke-width=".8" opacity=".24" fill="none" /></pattern>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5" /></filter>
  <clipPath id="crop"><rect width="1200" height="336" rx="18"/></clipPath>
  <style>
   .orbital { transform-origin: 954px 162px; animation: orbit 28s linear infinite; }
   .reverse { transform-origin: 954px 162px; animation: orbit 38s linear infinite reverse; }
   .pulse { animation: pulse 3.8s ease-in-out infinite; }
   .ping { animation: ping 4s ease-in-out infinite; }
   .sweep { animation: sweep 8s ease-in-out infinite; }
   @keyframes orbit { to { transform: rotate(360deg); } }
   @keyframes pulse { 0%,100% { opacity:.4; } 50% { opacity:1; } }
   @keyframes ping { 0%,100% { r:4;opacity:.55;} 50% {r:7;opacity:1;} }
   @keyframes sweep { 0%,100% { transform:translateX(-200px); opacity:0; } 40%,60% {opacity:.22} 70% {transform:translateX(1450px); opacity:0;} }
   @media (prefers-reduced-motion: reduce) { .orbital,.reverse,.pulse,.ping,.sweep {animation:none} }
  </style>
</defs>
<g clip-path="url(#crop)">
